pre-commit:
  jobs:
    - name: lint python
      glob: "*.py" # glob filter
      # --force-exclude: ruff ignores `exclude` for paths named on the command line,
      # and {staged_files} names them (the vendored omp-ui/src snapshot must stay
      # byte-identical, so it cannot be ruff-fixed).
      run: ruff check --force-exclude --config ./ruff.pre-commit.toml {staged_files}

    - name: lint web
      root: web/
      glob: "web/**/*.{js,ts,tsx}"
      run: pnpm exec eslint {staged_files}

    - name: lint bootstrap installer
      root: apps/bootstrap-installer/
      glob: "*.{js,ts,tsx}"
      run: pnpm exec eslint {staged_files}

    - name: lint desktop app
      root: apps/desktop/
      glob: "*.{js,ts,tsx}"
      run: pnpm exec eslint {staged_files}

    - name: lint tui
      root: ui-tui/
      glob: "*.{js,ts,tsx}"
      run: pnpm exec eslint {staged_files}

    - name: lint shared
      root: apps/shared/
      glob: "*.{js,ts,tsx}"
      run: pnpm exec eslint {staged_files}

    - name: lint tests
      root: tests-js/
      glob: "*.{js,ts,tsx}"
      run: pnpm exec eslint {staged_files}
